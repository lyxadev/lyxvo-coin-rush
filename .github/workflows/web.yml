name: Export & deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.2 and export templates
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --max-time 300 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.2-stable/Godot_v4.2-stable_linux.x86_64.zip
          unzip -q -o godot.zip
          sudo mv -f Godot_v4.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fsSL --retry 3 --retry-all-errors --max-time 600 -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.2-stable/Godot_v4.2-stable_export_templates.tpz
          rm -rf tpl && mkdir tpl
          unzip -q templates.tpz -d tpl
          TDIR="$HOME/.local/share/godot/export_templates/4.2.stable"
          mkdir -p "$TDIR"
          cp -r tpl/templates/. "$TDIR/"
          test -f "$TDIR/web_nothreads_release.zip"
          godot --version

      - name: Write export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="export/web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          EOF

      - name: Import project resources
        timeout-minutes: 8
        run: |
          set -o pipefail
          timeout 420 godot --headless --editor --quit 2>&1 | tail -n 40
          test -d .godot/imported && echo "Imported OK"

      - name: Export Web build
        timeout-minutes: 8
        run: |
          set -o pipefail
          mkdir -p export/web
          timeout 420 godot --headless --export-release "Web" export/web/index.html 2>&1 | tail -n 60
          test -f export/web/index.html
          test -f export/web/index.wasm
          test -f export/web/index.pck
          ls -lh export/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
