name: Export & deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Newest run wins: a new push cancels any stuck run in the same group.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.2 (headless)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --max-time 300 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.2-stable/Godot_v4.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL --retry 3 --retry-all-errors --max-time 600 -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.2-stable/Godot_v4.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.stable
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/4.2.stable/
          godot --version

      - name: Write export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          export_path="export/web/index.html"
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          vram_texture_compression/for_desktop=true
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          EOF

      - name: Import project
        timeout-minutes: 5
        run: |
          timeout 180 godot --headless --import --quit || echo "Import finished with status $? (continuing)"

      - name: Export Web build
        timeout-minutes: 8
        run: |
          mkdir -p export/web
          timeout 300 godot --headless --export-release "Web" export/web/index.html
          test -f export/web/index.html && test -f export/web/index.wasm
          ls -lh export/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
